<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Pablo Cavalheiro</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0714">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&family=Syne:wght@700;800&display=swap">
  <!-- Página autônoma: funciona em qualquer endereço (GitHub Pages ou Netlify). -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { background: #0A0714; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      text-align: center;
      font-family: "Manrope", system-ui, sans-serif;
      color: #F5F1FF;
      background:
        radial-gradient(60% 50% at 15% 10%, rgba(123, 47, 247, .35), transparent 70%),
        radial-gradient(55% 45% at 90% 90%, rgba(255, 46, 147, .25), transparent 70%),
        #0A0714;
    }
    h1 {
      margin: 0;
      font-family: "Syne", system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(6rem, 26vw, 15rem);
      line-height: .9;
      letter-spacing: -.06em;
      background: linear-gradient(120deg, #A873FF, #FF4FA3 52%, #FF9E5E);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { max-width: 36ch; margin: 18px auto 32px; font-size: 1.1rem; line-height: 1.6; color: #B8B0D0; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 52px;
      padding: 15px 28px;
      border-radius: 999px;
      background: linear-gradient(120deg, #7B2FF7, #FF2E93 62%, #FF8A3D);
      color: #fff;
      font-family: "Syne", system-ui, sans-serif;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 14px 34px -12px rgba(255, 46, 147, .75);
    }
    a:focus-visible { outline: 2px solid #2EE6D6; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Essa página não existe. Mas a arte da sua empresa pode existir, e ser só dela.</p>
    <a href="/" id="home">Voltar para o início</a>
  </main>
  <script>
    // No GitHub Pages o site fica em /NOME-DO-REPOSITORIO/
    if (location.hostname.endsWith('github.io')) {
      var seg = location.pathname.split('/')[1];
      if (seg) document.getElementById('home').href = '/' + seg + '/';
    }
  </script>
</body>
</html>
